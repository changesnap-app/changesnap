<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChangeSnap account</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><div class="mark">CS</div><div>ChangeSnap<small>Contractor account</small></div></div><a class="ghost" href="/">Back to app</a></header><main class="account-wrap"><section class="panel form"><div class="section-title"><b>1</b><div><h2>Create your account</h2><p>Three approvals free. No card.</p></div></div><label>Business<input id="abusiness" autocomplete="organization"></label><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" minlength="8" autocomplete="new-password"></label><button class="primary" id="signup">Create free account</button><p id="msg" class="form-msg"></p></section></main><script>signup.onclick=async()=>{let r=await fetch('/api/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({business:abusiness.value,email:email.value,password:password.value})}),d=await r.json();msg.textContent=d.error||'Account created. You can now create shareable approvals.';if(r.ok)setTimeout(()=>location='/',800)}</script><footer style="max-width:1180px;margin:24px auto 30px;padding:0 24px;color:#587166;font-size:13px;font-family:Manrope,system-ui,sans-serif"><a href="/pricing">Pricing</a> · <a href="/privacy">Privacy policy</a> · <a href="/terms">Terms of service</a> · <a href="/refunds">Refunds</a> · Support: <a href="mailto:arikrock111@gmail.com">arikrock111@gmail.com</a></footer></body></html>
